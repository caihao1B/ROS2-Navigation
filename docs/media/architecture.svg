<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="336" viewBox="0 0 1080 336" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<title id="title">农田机器人建图、巡检决策与作业反馈</title>
<desc id="desc">建图把时间同步的双目、激光与里程计组织成位姿图。在线巡检用定位和障碍观测选择行为，再让底盘执行。作业工具独立计量并确认结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#426460"/></marker></defs>
<rect width="1080" height="336" rx="14" fill="#f1f5f2"/>
<g fill="#ffffff" stroke="#b7cdc3" stroke-width="1.5">
<rect x="116" y="22" width="270" height="84" rx="8"/><rect x="428" y="22" width="270" height="84" rx="8"/><rect x="740" y="22" width="314" height="84" rx="8"/>
<rect x="116" y="126" width="270" height="84" rx="8"/><rect x="428" y="126" width="270" height="84" rx="8"/><rect x="740" y="126" width="314" height="84" rx="8"/>
<rect x="116" y="230" width="270" height="84" rx="8"/><rect x="428" y="230" width="270" height="84" rx="8"/><rect x="740" y="230" width="314" height="84" rx="8"/>
</g>
<g fill="none" stroke="#426460" stroke-width="2" marker-end="url(#arrow)">
<path d="M389 64 H422"/><path d="M701 64 H734"/>
<path d="M389 168 H422"/><path d="M701 168 H734"/>
<path d="M389 272 H422"/><path d="M701 272 H734"/>
</g>
<g fill="#126656" font-size="22" font-weight="bold" text-anchor="middle"><text x="59" y="73">建图</text><text x="59" y="177">巡检</text><text x="59" y="281">作业</text></g>
<g fill="#17383e" font-size="21" font-weight="bold"><text x="134" y="55">双目、激光与里程计</text><text x="446" y="55">RTAB-Map</text><text x="758" y="55">优化位姿图与三维点云</text>
<text x="134" y="159">位置与障碍观测</text><text x="446" y="159">行为树与动作监督</text><text x="758" y="159">Nav2 与差速底盘</text>
<text x="134" y="263">点序与有向条带</text><text x="446" y="263">精停与曲率控制</text><text x="758" y="263">工具反馈账本</text></g>
<g fill="#486168" font-size="17"><text x="134" y="85">同步图像、稳定表面、局部位姿</text><text x="446" y="85">关键帧、重访与几何检验</text><text x="758" y="85">将扫描放回同一坐标系</text>
<text x="134" y="189">轮速、IMU、ICP、GNSS 与点云</text><text x="446" y="189">跟随、停车与恢复导航</text><text x="758" y="189">跟踪路径并确认底盘停车</text>
<text x="134" y="293">选择可达点序或读取条带计划</text><text x="446" y="293">点喷停稳，割草关刀换向</text><text x="758" y="293">确认出液、转速和有效扫掠</text></g>
</svg>
