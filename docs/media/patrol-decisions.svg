  <title id="title">巡检车跟随、等待与恢复的同场观测</title>
  <desc id="desc">三幅沿巡检路线展开的俯视示意，使用三个时刻的定位进度和观测净距。青绿色巡检车跟随琥珀色前车，前车停下后取消导航并停车等待，条件恢复后重新跟随。下图显示按时序采样的定位进度，停车窗内两车物理位姿保持不变，恢复后巡检车再次发生位移。</desc>
  <rect x="0" y="0" width="760" height="726" fill="#f5f7f2" rx="20" />
  <text x="27" y="52" font-size="34" fill="#17393c" font-weight="700" text-anchor="start">前车停下，巡检车如何响应？</text>
  <text x="29" y="85" font-size="20" fill="#465e59" font-weight="400" text-anchor="start">同场观测沿巡检路线展开</text>
