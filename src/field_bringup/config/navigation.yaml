controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    odom_topic: /localization/odometry
    enable_stamped_cmd_vel: false
    progress_checker_plugins:
    - progress
    goal_checker_plugins:
    - goal
    controller_plugins:
    - RPP
    progress:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.1
      movement_time_allowance: 20.0
    goal:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.12
      stateful: false
    RPP:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.4
      lookahead_dist: 0.65
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.9
      lookahead_time: 3.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.15
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.03
      use_rotate_to_heading: true
      allow_reversing: false
      max_angular_accel: 0.5
      max_robot_pose_search_dist: 8.0
      rotate_to_heading_angular_vel: 0.35
      rotate_to_heading_min_angle: 0.45
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: field::ExactGoalPlanner
      tolerance: 0.04
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/odometry
    bt_loop_duration: 20
    default_server_timeout: 1000
    wait_for_service_timeout: 2000
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    transform_tolerance: 0.15
    filter_duration: 0.3
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.15
      track_unknown_space: false
      always_send_full_costmap: true
      footprint: '[[-0.254, -0.215], [0.254, -0.215], [0.254, 0.215], [-0.254, 0.215]]'
      plugins:
      - observed
      - inflation
      - dynamic_history
      observed:
        plugin: field::ObservedRiskLayer
        topic: /perception/local_risk
        max_age: 0.6
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 4.0
      footprint_padding: 0.1
      dynamic_history:
        plugin: field::ObservedPriorLayer
        topic: /perception/dynamic_risk
        max_age: 0.6
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: false
      width: 142
      height: 61
      resolution: 0.15
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: '[[-0.254, -0.215], [0.254, -0.215], [0.254, 0.215], [-0.254, 0.215]]'
      plugins:
      - static
      - live_obstacles
      - inflation
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 4.0
      footprint_padding: 0.1
      origin_x: -19.0
      origin_y: 6.0
      static:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      live_obstacles:
        plugin: field::ObservedPriorLayer
        topic: /perception/dynamic_risk
        max_age: 0.6
map_server:
  ros__parameters:
    use_sim_time: true
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: false
    bond_timeout: 5.0
    node_names:
    - map_server
    - controller_server
    - planner_server
    - bt_navigator
